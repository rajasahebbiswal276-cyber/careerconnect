spring.application.name=CareerConnect
server.port=8080

# Default database: in-memory H2 (zero setup). Use the "mysql" profile for MySQL.
spring.datasource.url=jdbc:h2:mem:careerconnect;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# JWT (override JWT_SECRET in production; must be a Base64 string of at least 32 bytes)
app.jwt.secret=${JWT_SECRET:a6b/yEub8lSJq2eoukpIzJPGnog32xnijeinmJ+lnZPmsLAdYLOV8bvYp2doxVev}
app.jwt.expiration-ms=86400000

# Email notifications (optional). If spring.mail.host is not set, emails are only logged.
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply@careerconnect.local

springdoc.swagger-ui.path=/swagger-ui.html
spring.profiles.active=mysql